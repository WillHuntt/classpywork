<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
    </head>
    <body>
        <h3<a href="{{ url_for('show_all') }}">Student - Flask SQLAlchemy Example</a></h3>
        <hr>
        {% for message in get_flashed_messages() %}
            {{ message }}
        {% endfor %}
        <h3>Students (<a href="{{ url_for('new') }}">Add Student)</a></h3>
        <table border = 1>
            <thead>

                <td><h3>FirstName</h3></td>
                <td><h3>LastName</h3></td>
                <td><h3>Address</h3></td>
                <td><h3>City</h3></td>

            </thead>
            <tbody>
                {% for std in student %}
                    <tr>

                        <td><h3>{{ std.FirstName }}</h3></td>
                        <td><h3>{{ std.LastName }}</h3></td>
                        <td><h3>{{ std.Address }}</h3></td>
                        <td><h3>{{ std.City }}</h3></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </body>
</html>
