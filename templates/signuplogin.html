<!doctype html>
<html>
  <head>
    <title>Sign Up</title>
  </head>
  <body>
    <h1>Sign Up</h1>
    <form action="/signup" method="post">
      <input
        type="text"
        name="username"
        placeholder="Username"
        required
      /><br /><br />
      <input
        type="password"
        name="password"
        placeholder="Password"
        required
      /><br /><br />
      <input type="submit" value="Sign Up" />
    </form>
    <p>Already have an account? <a href="/login">Login here</a></p>
  </body>
</html>
