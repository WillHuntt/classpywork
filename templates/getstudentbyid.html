<!DOCTYPE html>
<html>
    <body>
        {%with messages = get_flashed_messages()%}

    {%if messages%}

    {% for message in messages %}

    <div>
        {{message}}
    </div>

    {%endfor%}
    {%endif%}
    {%endwith%}

            {% for row in rows %}

            <form action="/UpdateStudentByID" method="get" >
                <h3>Students Information</h3>
                <br>
                <input type="hidden" name="stdid" value={{row[0]}} />
                <br>
                FirstName
                <br>
                <input type="text" name="FirstName" value={{row[1]}} />
                <br>
                LastName
                <br>
                <input type="text" name="LastName" value={{row[2]}} />
                <br>

                Address
                <br>
                <textarea name="Address">{{row[3]}}</textarea>
                </br>

                City
                <br>
                <input type="text" name="City" value={{row[4]}} />
                </br>

                <input type="submit" name="submit" />

            </form>

            {% endfor %}
        <h2><a href="/">Go Back to home page</a></h2>    
    </body>
</html>
