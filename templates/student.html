<!--student.html-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Student</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Links directly to your centralized home.css file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>
<body>

    <!-- Animated Particle Background Container -->
    <div class="particle-background">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Main Container Card -->
    <div class="menu-container form-container">
        <h2>Students Information</h2>
        
        <form action="/addrec" method="post" class="student-form">
            <div class="form-group">
                <label for="FirstName">First Name</label>
                <input type="text" id="FirstName" name="FirstName" placeholder="Enter first name" required />
            </div>

            <div class="form-group">
                <label for="LastName">Last Name</label>
                <input type="text" id="LastName" name="LastName" placeholder="Enter last name" required />
            </div>

            <div class="form-group">
                <label for="Address">Address</label>
                <!-- Retained your original textarea component with updated styling -->
                <textarea id="Address" name="Address" rows="3" placeholder="Enter address details..." required></textarea>
            </div>

            <div class="form-group">
                <label for="City">City</label>
                <input type="text" id="City" name="City" placeholder="Enter city" required />
            </div>

            <div class="form-actions">
                <input type="submit" name="submit" value="Submit" class="menu-link submit-btn" />
                <a href="/" class="back-link">← Back to Menu</a>
            </div>
        </form>
    </div>

</body>
</html>
