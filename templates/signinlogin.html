<!doctype html>
<html>
  <head>
    <title>Login</title>
  </head>
  <body>
    {% if error %}
    <p style="color: red">{{ error }}</p>
    {% endif %}
    <h1>Login</h1>
    <form action="/login" method="post">
      <input
        type="text"
        name="username"
        placeholder="Username"
        required
      /><br /><br />
      <input
        type="password"
        name="password"
        placeholder="Password"
        required
      /><br /><br />
      <input type="submit" value="Login" />
    </form>
    <p>Don't have an account? <a href="/signup">Sign up here</a></p>
  </body>
</html>
